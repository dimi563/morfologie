<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Derivarea Cuvintelor în Română</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3EC;
    --ink: #1A1612;
    --muted: #7A6F65;
    --accent: #C84B2F;
    --accent-light: #F5E8E4;
    --success: #2E6B3E;
    --success-light: #E4F0E8;
    --border: #DDD5C8;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  .page-header { text-align: center; margin-bottom: 2.5rem; animation: fadeUp 0.6s ease both; }
  .page-header .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 5vw, 42px); font-weight: 600; line-height: 1.2; }
  .page-header h1 span { color: var(--accent); }
  .page-header p { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .container { width: 100%; max-width: 640px; }
  .cat-wrap { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; animation: fadeUp 0.6s 0.1s ease both; }
  .cat-btn { padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--muted); transition: all 0.15s; }
  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .progress-text { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dif-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 1rem; }
  .dif-1 { background: #E4F0E8; color: var(--success); }
  .dif-2 { background: #FFF3DC; color: #7A5200; }
  .dif-3 { background: var(--accent-light); color: var(--accent); }
  .q-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 2rem; animation: fadeUp 0.35s ease both; margin-bottom: 1rem; }
  .q-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .q-category { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  .q-difficulty { display: flex; gap: 3px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); display: inline-block; }
  .dot.on { background: var(--accent); }
  .q-text { font-family: 'Playfair Display', serif; font-size: 20px; line-height: 1.5; color: var(--ink); margin-bottom: 1.5rem; }
  .options { display: grid; gap: 10px; }
  .opt-btn { background: var(--cream); border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 18px; text-align: left; cursor: pointer; font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--ink); transition: all 0.15s; display: flex; align-items: center; gap: 12px; }
  .opt-letter { width: 26px; height: 26px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; transition: all 0.15s; color: var(--muted); }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
  .opt-btn:hover:not(:disabled) .opt-letter { background: var(--accent); color: #fff; }
  .opt-btn.correct { background: var(--success-light); border-color: var(--success); }
  .opt-btn.correct .opt-letter { background: var(--success); color: #fff; }
  .opt-btn.wrong { background: var(--accent-light); border-color: var(--accent); }
  .opt-btn.wrong .opt-letter { background: var(--accent); color: #fff; }
  .opt-btn.missed { background: var(--success-light); border-color: var(--success); opacity: 0.6; }
  .opt-btn.missed .opt-letter { background: var(--success); color: #fff; }
  .opt-btn:disabled { cursor: default; }
  .explanation { margin-top: 1rem; padding: 14px 16px; background: #FFF8F0; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 14px; color: var(--ink); line-height: 1.7; display: none; }
  .explanation.show { display: block; }
  .explanation strong { color: var(--accent); }
  .nav-row { display: flex; justify-content: space-between; align-items: center; }
  .score-pill { font-size: 13px; color: var(--muted); }
  .score-pill strong { color: var(--ink); }
  .next-btn { padding: 11px 28px; background: var(--ink); color: #fff; border: none; border-radius: 999px; cursor: pointer; font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500; display: none; transition: opacity 0.15s; }
  .next-btn.show { display: block; }
  .next-btn:hover { opacity: 0.8; }
  .results { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 3rem 2rem; text-align: center; animation: fadeUp 0.4s ease both; }
  .results-score { font-family: 'Playfair Display', serif; font-size: 56px; font-weight: 600; color: var(--ink); line-height: 1; }
  .results-total { font-size: 18px; color: var(--muted); margin-bottom: 6px; }
  .results-pct { font-size: 15px; color: var(--muted); margin-bottom: 1.25rem; }
  .results-msg { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--ink); margin-bottom: 2rem; line-height: 1.4; }
  .cat-results { display: grid; gap: 8px; margin-bottom: 2rem; text-align: left; }
  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--cream); border-radius: 8px; font-size: 14px; }
  .cat-row .cat-name { color: var(--ink); }
  .cat-row .cat-score { color: var(--accent); font-weight: 500; }
  .restart-btn { padding: 13px 36px; background: var(--accent); color: #fff; border: none; border-radius: 999px; cursor: pointer; font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: opacity 0.15s; }
  .restart-btn:hover { opacity: 0.85; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 480px) { .q-card { padding: 1.25rem; } .q-text { font-size: 17px; } }
</style>
</head>
<body>
<div class="page-header">
  <div class="label">Limba Română &middot; Morfologie</div>
  <h1>Derivarea <span>Cuvintelor</span></h1>
  <p>50 de întrebări &mdash; dificultate progresivă</p>
</div>
<div class="container">
  <div class="cat-wrap" id="catWrap"></div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <span class="progress-text" id="progText">0 / 0</span>
  </div>
  <div id="quizArea"></div>
</div>

<script>
const QUESTIONS = [
  // ── NIVEL 1 ─────────────────────────────────────────────────────────────────
  { cat: "Prefixe", dif: 1, q: "Ce prefix s-a adăugat pentru a forma cuvântul <strong>nebun</strong>?", opts: ["des-", "ne-", "re-", "in-"], ans: 1, exp: "Prefixul <strong>ne-</strong> exprimă negația în limba română: nu este bun." },
  { cat: "Prefixe", dif: 1, q: "Cuvântul <strong>reface</strong> conține prefixul:", opts: ["re-", "ra-", "ri-", "ru-"], ans: 0, exp: "Prefixul <strong>re-</strong> indică repetarea acțiunii: a face din nou." },
  { cat: "Sufixe", dif: 1, q: "Ce sufix formează substantivul <strong>cântăreț</strong> din verbul <em>a cânta</em>?", opts: ["-eț", "-tor", "-ție", "-are"], ans: 0, exp: "Sufixul <strong>-eț</strong> formează aici un substantiv care denumește un agent (o persoană care execută o activitate)." },
  { cat: "Sufixe", dif: 1, q: "Cuvântul <strong>frumusețe</strong> s-a format din <em>frumos</em> prin sufixul:", opts: ["-ețe", "-ime", "-ătate", "-ință"], ans: 0, exp: "Sufixul <strong>-ețe</strong> se adaugă la un adjectiv pentru a forma un substantiv abstract (frumos → frumusețe)." },
  { cat: "Cuvântul de bază", dif: 1, q: "Care este cuvântul de bază al derivatului <strong>floricea</strong>?", opts: ["floric", "floare", "înflorit", "flora"], ans: 1, exp: "Cuvântul de bază este <strong>floare</strong>, de la care s-a plecat în procesul de derivare cu sufix." },
  { cat: "Cuvântul de bază", dif: 1, q: "Cuvântul de bază al lui <strong>scriitor</strong> este:", opts: ["script", "a scrie", "scriere", "scris"], ans: 1, exp: "Derivarea pornește de la verbul <strong>a scrie</strong>, la care se adaugă sufixul de agent <em>-itor</em>." },
  { cat: "Prefixe", dif: 1, q: "Care dintre următoarele cuvinte conține prefixul <strong>des-</strong>?", opts: ["descântec", "dealer", "desen", "destin"], ans: 0, exp: "<strong>Descântec</strong> este format prin atașarea prefixului <em>des-</em> la cuvântul de bază <em>cântec</em>. La celelalte, sunetele fac parte din rădăcină." },
  { cat: "Sufixe", dif: 1, q: "Sufixul <strong>-ar</strong> din <em>lemnar</em> sau <em>fierar</em> indică:", opts: ["Un obiect", "O meserie sau ocupație", "O calitate", "O acțiune"], ans: 1, exp: "Sufixul <strong>-ar</strong> este un sufix de agent foarte productiv, care denumește ocupații sau meserii." },
  { cat: "Tipuri de derivare", dif: 1, q: "Derivarea prin adăugarea unui element specific la ÎNCEPUTUL cuvântului se numește:", opts: ["Sufixare", "Prefixare", "Compunere", "Conversiune"], ans: 1, exp: "<strong>Prefixarea</strong> constă în adăugarea unui prefix înaintea rădăcinii cuvântului." },
  { cat: "Tipuri de derivare", dif: 1, q: "Derivarea prin adăugarea unui element specific la SFÂRȘITUL rădăcinii se numește:", opts: ["Prefixare", "Conversiune", "Sufixare", "Abreviere"], ans: 2, exp: "<strong>Sufixarea</strong> reprezintă atașarea unui sufix după rădăcina cuvântului de bază." },

  // ── NIVEL 1-2 ────────────────────────────────────────────────────────────────
  { cat: "Prefixe", dif: 2, q: "Care este cuvântul de bază al lui <strong>desface</strong>?", opts: ["des", "face", "desfa", "desfac"], ans: 1, exp: "Prefixul <strong>des-</strong> (care arată inversul acțiunii) se atașează cuvântului de bază <strong>face</strong>." },
  { cat: "Prefixe", dif: 2, q: "Prefixul <strong>stră-</strong> din <em>strănepot</em> exprimă:", opts: ["Negație", "Repetiție", "Un grad mai îndepărtat al rudeniei", "Poziția spațială"], ans: 2, exp: "În terminologia rudeniei, prefixul <strong>stră-</strong> indică îndepărtarea cu o generație (străbunic, strănepot)." },
  { cat: "Sufixe", dif: 2, q: "Ce sufix s-a folosit pentru a forma adjectivul <strong>muncitor</strong> din verbul <em>a munci</em>?", opts: ["-or", "-tor", "-itor", "-ător"], ans: 2, exp: "Sufixul este <strong>-itor</strong>, aplicat la rădăcina verbului <em>munc-</em> (a munci)." },
  { cat: "Sufixe", dif: 2, q: "Care dintre următoarele sufixe formează în mod tipic diminutive?", opts: ["-esc", "-ușă / -uleț", "-tor", "-itate"], ans: 1, exp: "Sufixele <strong>-ușă</strong> (căruță, căsușă) și <strong>-uleț</strong> (băiețuleț) micșorează ipotetic dimensiunea sau exprimă simpatia." },
  { cat: "Cuvântul de bază", dif: 2, q: "Care este cuvântul de bază al lui <strong>înflori</strong>?", opts: ["în", "flori", "floare", "florit"], ans: 2, exp: "Cuvântul de bază este substantivul <strong>floare</strong>, la care s-a aplicat prefixul <em>în-</em> și sufixul verbal <em>-i</em>." },
  { cat: "Cuvântul de bază", dif: 2, q: "Verbul <strong>dezamăgi</strong> provine direct din:", opts: ["amăgi", "măgi", "amăgeală", "dez"], ans: 0, exp: "Se pornește de la verbul existent <strong>amăgi</strong>, căruia i se adaugă prefixul privativ/negativ <em>dez-</em>." },
  { cat: "Prefixe", dif: 2, q: "Care dintre următoarele cuvinte NU conține un prefix?", opts: ["nedrept", "rescrie", "deal", "dezordine"], ans: 2, exp: "<strong>Deal</strong> este un cuvânt simplu, primar. Celelalte conțin prefixe clare: ne-, re-, dez-." },
  { cat: "Sufixe", dif: 2, q: "Adjectivul <strong>școlăresc</strong> s-a format de la substantivul <em>școlar</em> cu ajutorul sufixului:", opts: ["-esc", "-ime", "-enie", "-ătate"], ans: 0, exp: "Sufixul adjectival <strong>-esc</strong> indică o caracteristică sau o apartenență (școlar → școlăresc)." },
  { cat: "Tipuri de derivare", dif: 2, q: "Substantivul <strong>postul</strong> provine din verbul <em>a posta</em>. Acest procedeu reprezintă o:", opts: ["Prefixare", "Sufixare", "Conversiune", "Compunere"], ans: 2, exp: "Este vorba despre <strong>conversiune</strong> (schimbarea valorii gramaticale), substantivul formându-se prin articularea directă a unei forme verbale sau prin schimbarea clasei morfologice." },
  { cat: "Sufixe", dif: 2, q: "Sufixul abstract <strong>-ătate</strong> formează în general:", opts: ["Verbe", "Adjective", "Substantive abstracte", "Adverbe"], ans: 2, exp: "Sufixul <strong>-ătate</strong> se atașează la adjective pentru a genera substantive abstracte: bun → bunătate, singur → singurătate." },

  // ── NIVEL 2 ─────────────────────────────────────────────────────────────────
  { cat: "Prefixe", dif: 2, q: "Prefixele <strong>in-</strong> și <strong>im-</strong> din <em>incorect</em> și <em>imposibil</em> au rolul de a exprima:", opts: ["Repetiția", "Negația sau absența", "Direcția", "Timpul"], ans: 1, exp: "Sunt variante ale aceluiași prefix cu rol negativ/privativ. Se folosește <em>im-</em> înaintea consoanelor labiale <em>b</em> și <em>p</em>." },
  { cat: "Sufixe", dif: 2, q: "Prin ce sufix s-a format substantivul <strong>alergare</strong> din verbul <em>a alerga</em>?", opts: ["-re", "-are", "-ere", "-ire"], ans: 1, exp: "Sufixul este <strong>-are</strong>, specific substantivelor provenite din infinitive lungi ale verbelor de conjugarea I." },
  { cat: "Cuvântul de bază", dif: 2, q: "Care este cuvântul de bază istoric/etimologic pentru verbul <strong>răsfăța</strong>?", opts: ["răs", "față", "făța", "răsfăț"], ans: 1, exp: "Derivatul s-a format inițial de la substantivul <strong>față</strong> (răs- + față + sufixul -a), având sensul de a întoarce fața spre cineva sau a-l alinta." },
  { cat: "Cuvântul de bază", dif: 2, q: "Cuvântul <strong>îmbătrâni</strong> are ca bază de pornire:", opts: ["îm", "bătrân", "trân", "bătrâni"], ans: 1, exp: "Cuvântul de bază este adjectivul/substantivul <strong>bătrân</strong>, la care s-au adăugat simultan afixele." },
  { cat: "Sufixe", dif: 2, q: "Ce sufix s-a folosit pentru a forma adverbul în exemplul: <em>El cântă frumos</em>?", opts: ["Niciun sufix (forma e obținută prin conversiune)", "-mente", "-ește", "-nic"], ans: 0, exp: "Multe adverbe de mod provin direct din forma de masculin singular a adjectivului, prin **conversiune**, fără sufixe suplimentare." },
  { cat: "Prefixe", dif: 2, q: "Prefixul <strong>răs- / răz-</strong> în cuvinte precum <em>răscoli</em> sau <em>răzbate</em> indică în general:", opts: ["Negație", "Intensificarea sau repetarea unei acțiuni", "Direcția în jos", "Originea etnică"], ans: 1, exp: "Prefixul <strong>răs- / răz-</strong> are valoare intensivă sau indică o mișcare de dispersie/repetare." },
  { cat: "Tipuri de derivare", dif: 2, q: "Care pereche ilustrează o derivare prin sufixare de la adjectiv la substantiv?", opts: ["bun → bunătate", "a scrie → scriere", "carte → cărticică", "a citi → cititor"], ans: 0, exp: "<strong>Bun</strong> (adjectiv) devine <strong>bunătate</strong> (substantiv) prin adăugarea sufixului <em>-ătate</em>." },
  { cat: "Tipuri de derivare", dif: 2, q: "Raportul dintre <strong>cărticică</strong> și <em>carte</em> reprezintă o derivare cu:", opts: ["Prefix", "Sufix diminutival", "Sufix augmentativ", "Conversiune"], ans: 1, exp: "Sufixul <strong>-ică</strong> este un sufix diminutival atașat cuvântului de bază." },
  { cat: "Prefixe", dif: 2, q: "Câte prefixe conține cuvântul derivat <strong>nerecunoscut</strong>?", opts: ["Unul", "Două", "Trei", "Niciunul"], ans: 1, exp: "Conține **două** prefixe adăugate succesiv: <strong>ne-</strong> + <strong>re-</strong> + cunoscut." },
  { cat: "Sufixe", dif: 2, q: "Sufixul neologice <strong>-ism</strong> (ex: <em>realism</em>, <em>clasicism</em>) servește la formarea de:", opts: ["Adjective", "Verbe", "Substantive abstracte care denumesc doctrine sau curente", "Adverbe de timp"], ans: 2, exp: "Sufixul <strong>-ism</strong> creează substantive care denumesc sisteme de gândire, doctrine, curente literare sau științifice." },

  // ── NIVEL 2-3 ────────────────────────────────────────────────────────────────
  { cat: "Prefixe", dif: 3, q: "Care dintre următoarele cuvinte conține prefixul neologic <strong>ante-</strong> cu sensul de <em>înainte</em>?", opts: ["antebelic", "antena", "antet", "antidot"], ans: 0, exp: "<strong>Antebelic</strong> = dinaintea războiului (ante- + bellum). În cazul celorlalte cuvinte, secvența nu este un prefix." },
  { cat: "Sufixe", dif: 3, q: "Care dintre următoarele sufixe formează substantive colective?", opts: ["-ătate", "-ime", "-itor", "-esc"], ans: 1, exp: "Sufixul <strong>-ime</strong> desemnează o colectivitate sau o mulțime de obiecte/ființe de același fel: tinerime, muncitorime." },
  { cat: "Cuvântul de bază", dif: 3, q: "Care este cuvântul de bază (lexemul primar) pentru seria din care face parte <strong>îndrăzneală</strong>?", opts: ["în", "drăzneț", "a îndrăzni", "drăzni (verb vechi)"], ans: 2, exp: "Substantivul <em>îndrăzneală</em> derivă direct de la verbul <strong>a îndrăzni</strong>, care reprezintă baza curentă a seriei." },
  { cat: "Tipuri de derivare", dif: 3, q: "Derivarea numită <strong>parasintetică</strong> presupune în mod obligatoriu:", opts: ["Adăugarea exclusivă a unui prefix", "Adăugarea exclusivă a unui sufix", "Adăugarea SIMULTANĂ a unui prefix și a unui sufix", "Contopirea a două cuvinte de bază"], ans: 2, exp: "Derivarea <strong>parasintetică</strong> înseamnă că un cuvânt se formează prin aplicarea concomitentă a unui prefix și a unui sufix (ex: în- + negru + -i = a înnegri)." },
  { cat: "Prefixe", dif: 3, q: "Prefixul de origine greacă <strong>hiper-</strong> (ex: <em>hipertensiune</em>) exprimă ideea de:", opts: ["Sub nivelul normal", "Exces / peste limitele normale", "Negație totală", "Anterioritate temporală"], ans: 1, exp: "Prefixul <strong>hiper-</strong> indică o dimensiune exagerată sau o depășire a limitelor standard." },
  { cat: "Sufixe", dif: 3, q: "Sufixul neologic <strong>-itudine</strong> (ex: <em>exactitudine</em>, <em>amplitudine</em>) formează:", opts: ["Verbe la modul infinitiv", "Substantive abstracte care indică o calitate sau stare", "Adjective calitative", "Adverbe de mod"], ans: 1, exp: "Sufixul împrumutat din latină sau franceză formează substantive abstracte calitative." },
  { cat: "Cuvântul de bază", dif: 3, q: "Substantivul <strong>întuneric</strong> provine istoric prin derivare de la:", opts: ["tuner", "tuneric", "întunecat", "întuneca (verb)"], ans: 3, exp: "Substantivul s-a format prin derivare regresivă sau direct de la verbul de bază <strong>a întuneca</strong>." },
  { cat: "Tipuri de derivare", dif: 3, q: "Conversiunea (sau schimbarea valorii gramaticale) se definește prin:", opts: ["Adăugarea de sufixe lexicale", "Atașarea de prefixe vechi", "Trecerea unui cuvânt dintr-o clasă morfologică în alta, fără afixe derivatice", "Eliminarea sunetelor finale dintr-un cuvânt"], ans: 2, exp: "La <strong>conversiune</strong>, cuvântul își schimbă comportamentul și clasa gramaticală pur contextual, fără modificări de formă prin sufixe sau prefixe." },
  { cat: "Prefixe", dif: 3, q: "Prefixul <strong>inter-</strong> din cuvântul <em>internațional</em> exprimă:", opts: ["O opoziție", "O relație sau o situare între două sau mai multe entități", "O acțiune repetată", "O valoare superlativă"], ans: 1, exp: "<strong>Inter-</strong> provine din latina clasică și înseamnă din punct de vedere semantic „între”." },
  { cat: "Sufixe", dif: 3, q: "Care dintre următoarele sufixe este specializat în formarea numelor de locuri (locații comerciale/ateliere)?", opts: ["-ărie", "-itor", "-esc", "-ătate"], ans: 0, exp: "Sufixul <strong>-ărie</strong> este utilizat pentru unități administrative sau comerciale: brutărie, covrigărie, cizmărie." },

  // ── NIVEL 3 ─────────────────────────────────────────────────────────────────
  { cat: "Tipuri de derivare", dif: 3, q: "Care dintre următoarele exemple este un derivat PARASINTETIC corect?", opts: ["re + face", "în + alb + i (a înălbi)", "cântă + tor", "ne + bun"], ans: 1, exp: "Verbul <strong>a înălbi</strong> s-a format adăugând simultan prefixul <em>în-</em> și sufixul <em>-i</em> la adjectivul de bază <em>alb</em>." },
  { cat: "Prefixe", dif: 3, q: "Prefixul <strong>sub-</strong> din cuvinte ca <em>subsol</em> sau <em>subordonat</em> indică:", opts: ["Poziția superioară", "O plasare dedesubt sau un rang inferior", "O acțiune anulată", "O repetiție periodică"], ans: 1, exp: "Prefixul subliniază o subordonare ierarhică sau o localizare spațială inferioară." },
  { cat: "Sufixe", dif: 3, q: "Sufixul adjectival <strong>-bil</strong> întâlnit în <em>admirabil</em> sau <em>regretabil</em> exprimă:", opts: ["O negație", "Posibilitatea, capacitatea sau destinația", "Un exces de trăsături", "O localizare geografică"], ans: 1, exp: "Sufixul <strong>-bil</strong> arată că o acțiune poate fi realizată sau merită să fie realizată (admirabil = care poate/merită să fie admirat)." },
  { cat: "Cuvântul de bază", dif: 3, q: "Care este rădăcina structurală comună în seria lexicală formată din: <em>a scrie, scriitor, scriere, inscripție</em>?", opts: ["scri- / script-", "scrie-", "scriber-", "scris-"], ans: 0, exp: "Rădăcina etimologică are variantele alofonice <strong>scri- / script-</strong> (moștenite din latinescul <em>scribere / scriptus</em>)." },
  { cat: "Tipuri de derivare", dif: 3, q: "Adaptarea morfologică a unui neologism (ex: <em>a downloada</em>) nu reprezintă o derivare internă pură, ci un proces de:", opts: ["Conversiune simplă", "Derivare regresivă", "Împrumut lexical și încadrare morfologică", "Compunere prin sudare"], ans: 2, exp: "Este vorba despre preluarea unui element extern (**împrumut**) urmată de aplicarea desinențelor specifice limbii române pentru integrare." },
  { cat: "Prefixe", dif: 3, q: "Care dintre următoarele perechi conține prefixe neologice antonime?", opts: ["pre- și pro-", "hiper- și hipo-", "re- și răs-", "ne- și în-"], ans: 1, exp: "<strong>Hiper-</strong> (peste măsură) și <strong>hipo-</strong> (sub nivelul normal) sunt antonime perfecte (ex: hipertensiune / hipotensiune)." },
  { cat: "Sufixe", dif: 3, q: "Sufixul <strong>-tor</strong> poate genera adjective sau substantive. În structura „un discurs convingător”, acesta formează un:", opts: ["Substantiv de agent", "Adjectiv", "Adverb de mod", "Verb la participiu"], ans: 1, exp: "Deoarece determină substantivul „discurs” și se acordă în gen, număr și caz cu acesta, „convingător” este un **adjectiv**." },
  { cat: "Cuvântul de bază", dif: 3, q: "Identificați seria în care TOATE cuvintele au absolut același cuvânt de bază curent:", opts: ["înalt, înălțime, înălța, altitudine", "frate, frățesc, înfrăți, frățior", "a merge, mergând, mers, mersul"], ans: 1, exp: "Toate cuvintele din seria a doua se raportează direct la substantivul de bază <strong>frate</strong>. <em>Altitudine</em> este împrumut neologic, nu derivat de la <em>înalt</em>." },
  { cat: "Tipuri de derivare", dif: 3, q: "Ce tip de derivare s-a aplicat la structurarea cuvântului <strong>dezrădăcina</strong>?", opts: ["Prefixare simplă", "Sufixare simplă", "Derivare parasintetică", "Conversiune"], ans: 2, exp: "S-au adăugat structural elemente corelate (prefixul <em>dez-</em> și sufixul verbal <em>-a</em>) în jurul rădăcinii substantivului <em>rădăcină</em>." },
  { cat: "Sufixe", dif: 3, q: "Sufixele etnice/geografice <strong>-ean / -an</strong> (ex: <em>brașovean</em>, <em>clujean</em>) formează:", opts: ["Adjective de culoare", "Substantive sau adjective care indică originea geografică (gentilice)", "Verbe de mișcare", "Substantive strict abstracte"], ans: 1, exp: "Sunt sufixe specifice pentru locuitorii unui spațiu geografic sau administrativ." },
  { cat: "Prefixe", dif: 3, q: "Care dintre următoarele cuvinte conține un prefix grecesc cu sensul de <em>însuși / propriu</em>?", opts: ["autobiografie", "antibiotic", "preistorie", "intercultural"], ans: 0, exp: "Prefixul este <strong>auto-</strong> (provenit din gr. <em>autos</em> = el însuși, propriu), definind o acțiune îndreptată asupra sinelui." }
];

const cats = [...new Set(QUESTIONS.map(q => q.cat))];
let active = new Set(cats);
let pool = [], cur = 0, score = 0, catScore = {};
let answered = false;

function buildPool() {
  pool = QUESTIONS
    .filter(q => active.has(q.cat))
    .sort((a, b) => a.dif - b.dif);
  cur = 0; score = 0; answered = false;
  catScore = {};
  cats.forEach(c => catScore[c] = { right: 0, total: 0 });
  render();
}

function renderCats() {
  const el = document.getElementById('catWrap');
  el.innerHTML = cats.map((c, i) =>
    `<button class="cat-btn ${active.has(c) ? 'active' : ''}" data-ci="${i}">${c}</button>`
  ).join('');
  el.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = cats[+btn.dataset.ci];
      if (active.has(c)) { if (active.size > 1) active.delete(c); }
      else active.add(c);
      renderCats();
      buildPool();
    });
  });
}

const DIV_LABELS = { 1: 'Ușor', 2: 'Mediu', 3: 'Dificil' };

function render() {
  const area = document.getElementById('quizArea');
  const fill = document.getElementById('progFill');
  const txt = document.getElementById('progText');

  if (!pool.length) {
    area.innerHTML = '<p style="text-align:center;color:#7A6F65;padding:2rem">Selectează cel puțin o categorie.</p>';
    fill.style.width = '0%'; txt.textContent = '0 / 0'; return;
  }
  if (cur >= pool.length) { showResults(); return; }

  const pct = Math.round((cur / pool.length) * 100);
  fill.style.width = pct + '%';
  txt.textContent = `${cur} / ${pool.length}`;

  const q = pool[cur];
  const letters = ['A', 'B', 'C', 'D'];
  const dots = [1, 2, 3].map(d => `<span class="dot ${d <= q.dif ? 'on' : ''}"></span>`).join('');

  area.innerHTML = `
    <div class="q-card">
      <div class="q-top">
        <span class="q-category">${q.cat}</span>
        <span class="q-difficulty">${dots}</span>
      </div>
      <div class="dif-badge dif-${q.dif}">${DIV_LABELS[q.dif]}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.opts.map((o, i) => `
          <button class="opt-btn" data-i="${i}">
            <span class="opt-letter">${letters[i]}</span>${o}
          </button>`).join('')}
      </div>
      <div class="explanation" id="exp">💡 ${q.exp}</div>
    </div>
    <div class="nav-row">
      <span class="score-pill">Scor: <strong>${score}</strong> din ${cur}</span>
      <button class="next-btn" id="nxt">${cur + 1 < pool.length ? 'Următoarea →' : 'Vezi rezultatele →'}</button>
    </div>
  `;

  document.querySelectorAll('.opt-btn').forEach(b => {
    b.addEventListener('click', () => choose(+b.dataset.i));
  });
  document.getElementById('nxt').addEventListener('click', () => { cur++; render(); });
  answered = false;
}

function choose(idx) {
  if (answered) return;
  answered = true;
  const q = pool[cur];
  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add(idx === q.ans ? 'correct' : 'missed');
    else if (i === idx) b.classList.add('wrong');
  });
  catScore[q.cat].total++;
  if (idx === q.ans) { score++; catScore[q.cat].right++; }
  document.getElementById('exp').classList.add('show');
  document.getElementById('nxt').classList.add('show');
  document.querySelector('.score-pill').innerHTML = `Scor: <strong>${score}</strong> din ${cur + 1}`;
}

function showResults() {
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progText').textContent = `${pool.length} / ${pool.length}`;
  const pct = Math.round((score / pool.length) * 100);
  const msg = pct >= 85 ? 'Felicitări! Ești expert în derivarea cuvintelor.' :
              pct >= 70 ? 'Foarte bine! Cunoști bine morfologia limbii române.' :
              pct >= 50 ? 'Bine! Mai exersează categoriile mai dificile.' :
                          'Continuă să studiezi! Cu practică vei reuși.';

  const catRows = Object.entries(catScore)
    .filter(([, v]) => v.total > 0)
    .map(([c, v]) => `<div class="cat-row"><span class="cat-name">${c}</span><span class="cat-score">${v.right}/${v.total}</span></div>`)
    .join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="results">
      <div class="results-score">${score}/${pool.length}</div>
      <div class="results-total">răspunsuri corecte</div>
      <div class="results-pct">${pct}% din total</div>
      <div class="results-msg">${msg}</div>
      <div class="cat-results">${catRows}</div>
      <button class="restart-btn" id="rb">Încearcă din nou</button>
    </div>
  `;
  document.getElementById('rb').addEventListener('click', () => { buildPool(); renderCats(); });
}

renderCats();
buildPool();
</script>
</body>
</html>
