<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Compunerea Cuvintelor în Română</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3EC;
    --ink: #1A1612;
    --muted: #7A6F65;
    --accent: #2B5EA7;
    --accent-light: #E8EEF8;
    --success: #2E6B3E;
    --success-light: #E4F0E8;
    --border: #DDD5C8;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }
  .page-header { text-align: center; margin-bottom: 2.5rem; animation: fadeUp 0.6s ease both; }
  .page-header .label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .page-header h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 5vw, 42px); font-weight: 600; line-height: 1.2; }
  .page-header h1 span { color: var(--accent); }
  .page-header p { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .container { width: 100%; max-width: 640px; }
  .cat-wrap { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1.5rem; animation: fadeUp 0.6s 0.1s ease both; }
  .cat-btn { padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--muted); transition: all 0.15s; }
  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .progress-track { flex: 1; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .progress-text { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dif-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 1rem; }
  .dif-1 { background: #E4F0E8; color: var(--success); }
  .dif-2 { background: #FFF3DC; color: #7A5200; }
  .dif-3 { background: var(--accent-light); color: var(--accent); }
  .q-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 2rem; animation: fadeUp 0.35s ease both; margin-bottom: 1rem; }
  .q-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .q-category { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
  .q-difficulty { display: flex; gap: 3px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); display: inline-block; }
  .dot.on { background: var(--accent); }
  .q-text { font-family: 'Playfair Display', serif; font-size: 20px; line-height: 1.5; color: var(--ink); margin-bottom: 1.5rem; }
  .options { display: grid; gap: 10px; }
  .opt-btn { background: var(--cream); border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 18px; text-align: left; cursor: pointer; font-size: 15px; font-family: 'DM Sans', sans-serif; color: var(--ink); transition: all 0.15s; display: flex; align-items: center; gap: 12px; }
  .opt-letter { width: 26px; height: 26px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; transition: all 0.15s; color: var(--muted); }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
  .opt-btn:hover:not(:disabled) .opt-letter { background: var(--accent); color: #fff; }
  .opt-btn.correct { background: var(--success-light); border-color: var(--success); }
  .opt-btn.correct .opt-letter { background: var(--success); color: #fff; }
  .opt-btn.wrong { background: #FCEBEB; border-color: #A32D2D; }
  .opt-btn.wrong .opt-letter { background: #A32D2D; color: #fff; }
  .opt-btn.missed { background: var(--success-light); border-color: var(--success); opacity: 0.6; }
  .opt-btn.missed .opt-letter { background: var(--success); color: #fff; }
  .opt-btn:disabled { cursor: default; }
  .explanation { margin-top: 1rem; padding: 14px 16px; background: #F0F4FC; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; font-size: 14px; color: var(--ink); line-height: 1.7; display: none; }
  .explanation.show { display: block; }
  .explanation strong { color: var(--accent); }
  .nav-row { display: flex; justify-content: space-between; align-items: center; }
  .score-pill { font-size: 13px; color: var(--muted); }
  .score-pill strong { color: var(--ink); }
  .next-btn { padding: 11px 28px; background: var(--ink); color: #fff; border: none; border-radius: 999px; cursor: pointer; font-size: 14px; font-family: 'DM Sans', sans-serif; font-weight: 500; display: none; transition: opacity 0.15s; }
  .next-btn.show { display: block; }
  .next-btn:hover { opacity: 0.8; }
  .results { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 3rem 2rem; text-align: center; animation: fadeUp 0.4s ease both; }
  .results-score { font-family: 'Playfair Display', serif; font-size: 56px; font-weight: 600; color: var(--ink); line-height: 1; }
  .results-total { font-size: 18px; color: var(--muted); margin-bottom: 6px; }
  .results-pct { font-size: 15px; color: var(--muted); margin-bottom: 1.25rem; }
  .results-msg { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--ink); margin-bottom: 2rem; line-height: 1.4; }
  .cat-results { display: grid; gap: 8px; margin-bottom: 2rem; text-align: left; }
  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--cream); border-radius: 8px; font-size: 14px; }
  .cat-row .cat-name { color: var(--ink); }
  .cat-row .cat-score { color: var(--accent); font-weight: 500; }
  .restart-btn { padding: 13px 36px; background: var(--accent); color: #fff; border: none; border-radius: 999px; cursor: pointer; font-size: 15px; font-family: 'DM Sans', sans-serif; font-weight: 500; transition: opacity 0.15s; }
  .restart-btn:hover { opacity: 0.85; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 480px) { .q-card { padding: 1.25rem; } .q-text { font-size: 17px; } }
</style>
</head>
<body>
<div class="page-header">
  <div class="label">Limba Română &middot; Morfologie</div>
  <h1>Compunerea <span>Cuvintelor</span></h1>
  <p>Întrebări de fixare &mdash; alăturare, abreviere, subordonare</p>
</div>
<div class="container">
  <div class="cat-wrap" id="catWrap"></div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <span class="progress-text" id="progText">0 / 0</span>
  </div>
  <div id="quizArea"></div>
</div>

<script>
const QUESTIONS = [
  // ═══════════════════════════════════════════════
  // ALĂTURARE — NIVEL 1
  // ═══════════════════════════════════════════════
  { cat: "Alăturare", dif: 1,
    q: "Ce tip de compunere este <strong>floarea-soarelui</strong>?",
    opts: ["Subordonare", "Alăturare cu cratimă", "Abreviere", "Conversiune"],
    ans: 1,
    exp: "<strong>Alăturarea cu cratimă</strong>: cele două cuvinte (floare + soare) se unesc prin cratimă și formează un cuvânt compus nou." },

  { cat: "Alăturare", dif: 1,
    q: "Cuvântul compus <strong>bună-ziua</strong> este format prin:",
    opts: ["Subordonare", "Abreviere", "Alăturare cu cratimă", "Derivare"],
    ans: 2,
    exp: "<strong>Bună-ziua</strong> = bună + ziua, unite prin cratimă. Este un compus prin alăturare folosit ca formulă de salut." },

  { cat: "Alăturare", dif: 1,
    q: "Care dintre următoarele este un cuvânt compus prin <strong>alăturare sudată</strong> (fără cratimă)?",
    opts: ["floarea-soarelui", "binefăcător", "câine-lup", "bună-dimineața"],
    ans: 1,
    exp: "<strong>Binefăcător</strong> = bine + făcător, scris sudat (fără spațiu sau cratimă) — alăturare sudată." },

  { cat: "Alăturare", dif: 1,
    q: "Cuvântul <strong>untdelemn</strong> este un compus format din:",
    opts: ["unt + de + lemn", "un + t + de + lemn", "und + elemn", "Nu este cuvânt compus"],
    ans: 0,
    exp: "<strong>Untdelemn</strong> = unt + de + lemn. Compus prin alăturare sudată din trei elemente." },

  { cat: "Alăturare", dif: 1,
    q: "Care cuvânt compus este scris <strong>cu cratimă</strong>?",
    opts: ["binecuvântat", "portmoneu", "câine-lup", "aeroport"],
    ans: 2,
    exp: "<strong>Câine-lup</strong> se scrie cu cratimă — alăturare necontopită. Celelalte sunt sudate (fără cratimă)." },

  // ═══════════════════════════════════════════════
  // SUBORDONARE — NIVEL 1
  // ═══════════════════════════════════════════════
  { cat: "Subordonare", dif: 1,
    q: "Ce tip de compunere este <strong>portbagaj</strong>?",
    opts: ["Alăturare", "Subordonare", "Abreviere", "Derivare cu prefix"],
    ans: 1,
    exp: "<strong>Portbagaj</strong> = port- (poartă) + bagaj. Este compunere prin <strong>subordonare</strong>: primul element determină semantic pe al doilea." },

  { cat: "Subordonare", dif: 1,
    q: "Cuvântul <strong>telecomandă</strong> este format prin subordonare folosind elementul de compunere:",
    opts: ["tele-", "co-", "man-", "andă"],
    ans: 0,
    exp: "Elementul de compunere savant <strong>tele-</strong> (din greacă, = departe) + comandă → telecomandă (comandă de la distanță)." },

  { cat: "Subordonare", dif: 1,
    q: "Care este elementul de compunere din <strong>fotografie</strong>?",
    opts: ["foto- (lumină)", "foto- (apă)", "grafi- (scriere)", "Ambele foto- și -grafie"],
    ans: 3,
    exp: "<strong>Foto-</strong> (gr. <em>phos</em> = lumină) + <strong>-grafie</strong> (gr. <em>graphein</em> = a scrie) → fotografie = înregistrare cu ajutorul luminii." },

  { cat: "Subordonare", dif: 1,
    q: "Cuvântul <strong>geografie</strong> conține elementele de compunere:",
    opts: ["geo- (pământ) + -grafie (scriere)", "geo- (apă) + -grafie", "geo- (cer) + -logie", "geo- + -fonie"],
    ans: 0,
    exp: "<strong>Geo-</strong> (gr. <em>ge</em> = pământ) + <strong>-grafie</strong> (gr. <em>graphein</em> = a descrie) → geografie = descrierea pământului." },

  { cat: "Subordonare", dif: 1,
    q: "Care dintre cuvinte NU este format prin subordonare cu element de compunere savant?",
    opts: ["biologie", "termometru", "floarea-soarelui", "telescop"],
    ans: 2,
    exp: "<strong>Floarea-soarelui</strong> este compus prin <em>alăturare cu cratimă</em> din cuvinte independente, nu prin subordonare cu elemente savante." },

  // ═══════════════════════════════════════════════
  // ABREVIERE — NIVEL 1
  // ═══════════════════════════════════════════════
  { cat: "Abreviere", dif: 1,
    q: "Ce este <strong>ONU</strong>?",
    opts: ["Un cuvânt derivat", "O abreviere prin inițiale", "Un cuvânt compus prin alăturare", "Un element de compunere"],
    ans: 1,
    exp: "<strong>ONU</strong> = Organizația Națiunilor Unite. Este o <strong>abreviere prin inițiale</strong>." },

  { cat: "Abreviere", dif: 1,
    q: "Abrevierea <strong>TV</strong> provine din:",
    opts: ["Televizor Vechi", "TeleViziune", "Timp Vizual", "Transmisie Video"],
    ans: 1,
    exp: "<strong>TV</strong> = <strong>T</strong>ele<strong>V</strong>iziune. Abreviere prin inițiale folosită curent." },

  { cat: "Abreviere", dif: 1,
    q: "Care dintre următoarele este un <strong>acronim</strong> (abreviere care se citește direct ca un cuvânt)?",
    opts: ["CFR", "UNESCO", "SUA", "km/h"],
    ans: 1,
    exp: "<strong>UNESCO</strong> se citește ca un cuvânt legat (u-nes-co), fiind un <strong>acronim</strong>. CFR și SUA se citesc separat, literă cu literă." },

  { cat: "Abreviere", dif: 1,
    q: "Cuvântul <strong>radar</strong> provine dintr-o abreviere englezească. Ce înseamnă?",
    opts: ["Radio Detection And Ranging", "Rapid Aerial Detection And Relay", "Remote Area Data And Radio", "Radio Automatic Direction And Range"],
    ans: 0,
    exp: "<strong>RADAR</strong> = <em>Radio Detection And Ranging</em>. A intrat în limba română ca substantiv comun prin asimilarea completă a abrevierii." },

  { cat: "Abreviere", dif: 1,
    q: "Prescurtarea <strong>prof.</strong> este:",
    opts: ["Un acronim", "O abreviere grafică (nu se pronunță prescurtat)", "Un cuvânt compus", "Un element de compunere"],
    ans: 1,
    exp: "<strong>Prof.</strong> este o <strong>abreviere grafică</strong> — în text o scriem redusă pentru economie de spațiu, dar o citim întotdeauna integral: <em>profesor</em>." },

  // ═══════════════════════════════════════════════
  // ALĂTURARE — NIVEL 2
  // ═══════════════════════════════════════════════
  { cat: "Alăturare", dif: 2,
    q: "Care este diferența dintre <strong>alăturarea sudată</strong> și <strong>alăturarea cu cratimă</strong>?",
    opts: ["Nu există diferență", "Sudată: scris împreună; cu cratimă: unit prin -", "Sudată: folosește prefix; cu cratimă: folosește sufix", "Sudată: două cuvinte separate; cu cratimă: un singur cuvânt"],
    ans: 1,
    exp: "<strong>Sudată</strong>: cuvintele se contopesc complet din punct de vedere grafic (binefăcător). <strong>Cu cratimă</strong>: termenii rămân distincți, dar legați (floarea-soarelui)." },

  { cat: "Alăturare", dif: 2,
    q: "Cuvântul compus <strong>gură-cască</strong> denumește:",
    opts: ["Un tip de pește", "O persoană distrată sau gata să caște gura la orice", "Un instrument muzical", "Un tip de căpăcele"],
    ans: 1,
    exp: "<strong>Gură-cască</strong> = compus din substantiv + verb prin alăturare cu cratimă, folosit cu sens figurat pentru a descrie o persoană naivă sau gură-cască." },

  { cat: "Alăturare", dif: 2,
    q: "Identificați cuvântul compus prin <strong>alăturare sudată</strong>:",
    opts: ["cal-de-mare", "prim-ministru", "bunăvoință", "câine-lup"],
    ans: 2,
    exp: "<strong>Bunăvoință</strong> = bună + voință, scris complet contopit (fără cratimă sau spațiu)." },

  { cat: "Alăturare", dif: 2,
    q: "Cum se scrie corect adjectivul compus format din <em>bine</em> + <em>venit</em>?",
    opts: ["bine venit", "bine-venit", "binevenit", "Toate variantele sunt corecte"],
    ans: 2,
    exp: "Adjectivul este <strong>binevenit</strong> (compus prin alăturare sudată). Structura se scrie separat doar în contexte de tipul: <em>Bine ai venit!</em>" },

  { cat: "Alăturare", dif: 2,
    q: "Care dintre compuse este format prin <strong>alăturare cu ajutorul unei prepoziții</strong>?",
    opts: ["binefăcător", "untdelemn", "bunăstare", "câine"],
    ans: 1,
    exp: "<strong>Untdelemn</strong> = unt + <em>de</em> (prepoziție) + lemn. Structura s-a sudat complet în timp." },

  // ═══════════════════════════════════════════════
  // SUBORDONARE — NIVEL 2
  // ═══════════════════════════════════════════════
  { cat: "Subordonare", dif: 2,
    q: "Elementul de compunere savant <strong>bio-</strong> înseamnă:",
    opts: ["două", "viață", "carte", "lumină"],
    ans: 1,
    exp: "<strong>Bio-</strong> provine din grecescul <em>bios</em> (viață) și apare în compuse precum: biologie, biograf, biodiversitate." },

  { cat: "Subordonare", dif: 2,
    q: "Care pereche de elemente savante de compunere are sens <strong>antonim</strong>?",
    opts: ["macro- și mega-", "micro- și macro-", "tele- și foto-", "bio- și geo-"],
    ans: 1,
    exp: "<strong>Micro-</strong> (mic) și <strong>macro-</strong> (mare) reprezintă antonime perfecte în compunerea savantă: microscop vs. macroeconomie." },

  { cat: "Subordonare", dif: 2,
    q: "Cuvântul <strong>antropologie</strong> conține elementele savante:",
    opts: ["antro- (aer) + -logie", "antropo- (om) + -logie (știință)", "ant- + ro- + logie", "antropo- (animal) + -logie"],
    ans: 1,
    exp: "<strong>Antropo-</strong> (gr. <em>anthropos</em> = om) + <strong>-logie</strong> (gr. <em>logos</em> = știință) → antropologie = știința care studiază omul." },

  { cat: "Subordonare", dif: 2,
    q: "Elementul savant <strong>-fon / fono-</strong> din cuvinte ca <em>microfon</em> sau <em>fonologie</em> înseamnă:",
    opts: ["lumină", "sunet / voce", "scriere", "mișcare"],
    ans: 1,
    exp: "<strong>Fono- / -fon</strong> (gr. <em>phone</em>) se referă exclusiv la sunet sau voce: microfon, fonogramă, saxofon." },

  { cat: "Subordonare", dif: 2,
    q: "Care cuvânt conține sufixoidul (elementul secund) <strong>-tecă</strong>, însemnând colecție sau depozit?",
    opts: ["bibliotecă", "tehnică", "fantastică", "practică"],
    ans: 0,
    exp: "<strong>Biblio-tecă</strong> = biblio- (carte) + -tecă (depozit) → depozit sau colecție de cărți. La fel și în: discotecă, filmotecă." },

  { cat: "Subordonare", dif: 2,
    q: "Ce înseamnă elementul de compunere <strong>termo-</strong> întâlnit în termometru sau termostat?",
    opts: ["apă", "căldură", "viteză", "timp"],
    ans: 1,
    exp: "<strong>Termo-</strong> (gr. <em>thermos</em>) înseamnă căldură sau temperatură: termometru (aparat de măsurat căldura)." },

  { cat: "Subordonare", dif: 2,
    q: "Cuvântul <strong>cardiovascular</strong> conține elementul savant <em>cardio-</em> cu înțelesul de:",
    opts: ["creier", "inimă", "sânge", "plămân"],
    ans: 1,
    exp: "<strong>Cardio-</strong> (gr. <em>kardia</em>) se referă la inimă: cardiovascular, cardiologie, cardiogramă." },

  // ═══════════════════════════════════════════════
  // ABREVIERE — NIVEL 2
  // ═══════════════════════════════════════════════
  { cat: "Abreviere", dif: 2,
    q: "Ce tip de abreviere este <strong>TAROM</strong>?",
    opts: ["Abreviere grafică", "Acronim lexicalizat", "Abreviere prin inițiale citită literal", "Simbol"],
    ans: 1,
    exp: "<strong>TAROM</strong> (Transporturile Aeriene ROMâne) este un <strong>acronim lexicalizat</strong>, deoarece se pronunță fluid ca un cuvânt și se comportă ca un substantiv comun." },

  { cat: "Abreviere", dif: 2,
    q: "Care abreviere reprezintă un <strong>simbol internațional</strong> (și nu se scrie cu punct la final)?",
    opts: ["prof.", "ONG", "km", "pct."],
    ans: 2,
    exp: "<strong>km</strong> (kilometru) este un <strong>simbol metric internațional</strong>. Regulile prevăd că simbolurile și acronimele nu primesc punct la final." },

  { cat: "Abreviere", dif: 2,
    q: "Abrevierea <strong>ONG</strong> înseamnă:",
    opts: ["Organizație Non-Guvernamentală", "Organizație Națională de Guvernare", "Oficiu Național de Gestionare", "Ordine Națională Generală"],
    ans: 0,
    exp: "<strong>ONG</strong> = <strong>O</strong>rganizație <strong>N</strong>on-<strong>G</strong>uvernamentală. Fiind o abreviere prin inițiale clasică, se citește literă cu literă (O-N-G)." },

  { cat: "Abreviere", dif: 2,
    q: "Cum se numește procedeul prin care o abreviere devine cuvânt de sine stătător în vocabular (ex: <em>laser, radar</em>)?",
    opts: ["Derivare", "Lexicalizarea abrevierii", "Conversiune", "Compunere prin alăturare"],
    ans: 1,
    exp: "Prin <strong>lexicalizare</strong>, abrevierea își pierde caracterul pur tehnic și intră direct în vocabular ca substantiv obișnuit (un laser, laserele)." },

  { cat: "Abreviere", dif: 2,
    q: "Ce abreviere grafică consacrată se folosește pentru expresia latină <em>et cetera</em>?",
    opts: ["e.g.", "i.e.", "etc.", "cf."],
    ans: 2,
    exp: "<strong>Etc.</strong> provine de la <em>et cetera</em> (și celelalte / și altele). Este o abreviere grafică, textul citindu-se integral." },

  // ═══════════════════════════════════════════════
  // ALĂTURARE — NIVEL 3
  // ═══════════════════════════════════════════════
  { cat: "Alăturare", dif: 3,
    q: "Care dintre compuse are structural la bază un <strong>Adjectiv + Substantiv</strong> (sudat)?",
    opts: ["floarea-soarelui", "bunăstare", "câine-lup", "gură-cască"],
    ans: 1,

const cats = [...new Set(QUESTIONS.map(q => q.cat))];
let active = new Set(cats);
let pool = [], cur = 0, score = 0, catScore = {};
let answered = false;

function buildPool() {
  pool = QUESTIONS
    .filter(q => active.has(q.cat))
    .sort((a, b) => a.dif - b.dif);
  cur = 0; score = 0; answered = false;
  catScore = {};
  cats.forEach(c => catScore[c] = { right: 0, total: 0 });
  render();
}

function renderCats() {
  const el = document.getElementById('catWrap');
  el.innerHTML = cats.map((c, i) =>
    `<button class="cat-btn ${active.has(c) ? 'active' : ''}" data-ci="${i}">${c}</button>`
  ).join('');
  el.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = cats[+btn.dataset.ci];
      if (active.has(c)) { if (active.size > 1) active.delete(c); }
      else active.add(c);
      renderCats();
      buildPool();
    });
  });
}

const DIV_LABELS = { 1: 'Ușor', 2: 'Mediu', 3: 'Dificil' };

function render() {
  const area = document.getElementById('quizArea');
  const fill = document.getElementById('progFill');
  const txt = document.getElementById('progText');

  if (!pool.length) {
    area.innerHTML = '<p style="text-align:center;color:#7A6F65;padding:2rem">Selectează cel puțin o categorie.</p>';
    fill.style.width = '0%'; txt.textContent = '0 / 0'; return;
  }
  if (cur >= pool.length) { showResults(); return; }

  const pct = Math.round((cur / pool.length) * 100);
  fill.style.width = pct + '%';
  txt.textContent = `${cur} / ${pool.length}`;

  const q = pool[cur];
  const letters = ['A', 'B', 'C', 'D'];
  const dots = [1, 2, 3].map(d => `<span class="dot ${d <= q.dif ? 'on' : ''}"></span>`).join('');

  area.innerHTML = `
    <div class="q-card">
      <div class="q-top" style="justify-content:flex-end">
        <span class="q-difficulty">${dots}</span>
      </div>
      <div class="dif-badge dif-${q.dif}">${DIV_LABELS[q.dif]}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.opts.map((o, i) => `
          <button class="opt-btn" data-i="${i}">
            <span class="opt-letter">${letters[i]}</span>${o}
          </button>`).join('')}
      </div>
      <div class="explanation" id="exp">💡 ${q.exp}</div>
    </div>
    <div class="nav-row">
      <span class="score-pill">Scor: <strong>${score}</strong> din ${cur}</span>
      <button class="next-btn" id="nxt">${cur + 1 < pool.length ? 'Următoarea →' : 'Vezi rezultatele →'}</button>
    </div>
  `;

  document.querySelectorAll('.opt-btn').forEach(b => {
    b.addEventListener('click', () => choose(+b.dataset.i));
  });
  document.getElementById('nxt').addEventListener('click', () => { cur++; render(); });
  answered = false;
}

function choose(idx) {
  if (answered) return;
  answered = true;
  const q = pool[cur];
  document.querySelectorAll('.opt-btn').forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add(idx === q.ans ? 'correct' : 'missed');
    else if (i === idx) b.classList.add('wrong');
  });
  catScore[q.cat].total++;
  if (idx === q.ans) { score++; catScore[q.cat].right++; }
  document.getElementById('exp').classList.add('show');
  document.getElementById('nxt').classList.add('show');
  document.querySelector('.score-pill').innerHTML = `Scor: <strong>${score}</strong> din ${cur + 1}`;
}

function showResults() {
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progText').textContent = `${pool.length} / ${pool.length}`;
  const pct = Math.round((score / pool.length) * 100);
  const msg = pct >= 85 ? 'Felicitări! Ești expert în compunerea cuvintelor.' :
              pct >= 70 ? 'Foarte bine! Stăpânești bine morfologia limbii române.' :
              pct >= 50 ? 'Bine! Mai exersează categoriile mai dificile.' :
                          'Continuă să studiezi! Cu practică vei reuși.';

  const catRows = Object.entries(catScore)
    .filter(([, v]) => v.total > 0)
    .map(([c, v]) => `<div class="cat-row"><span class="cat-name">${c}</span><span class="cat-score">${v.right}/${v.total}</span></div>`)
    .join('');

  document.getElementById('quizArea').innerHTML = `
    <div class="results">
      <div class="results-score">${score}/${pool.length}</div>
      <div class="results-total">răspunsuri corecte</div>
      <div class="results-pct">${pct}% din total</div>
      <div class="results-msg">${msg}</div>
      <div class="cat-results">${catRows}</div>
      <button class="restart-btn" id="rb">Încearcă din nou</button>
    </div>
  `;
  document.getElementById('rb').addEventListener('click', () => { buildPool(); renderCats(); });
}

renderCats();
buildPool();
</script>
